# Neuzo Configuration File
# Secrets can be overridden via environment variables - see backend/.env.example

database:
  host: "localhost"
  port: 3306
  database: "neuzo_db"
  user: "root"
  password: "root"
  pool_size: 5
  pool_recycle: 3600

news_api:
  api_key: "3f15adc8f07344a8b09c3e6473694b24"

# newsapi | crawler | auto
news_pipeline:
  provider: "auto"

# Local LLM used only by the news crawler
ollama:
  enabled: true
  host: "http://localhost:11434"
  model: "gemma4:e4b"
  timeout_seconds: 60

session:
  expiry_hours: 24

time_window_hours: 1

nlp:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  similarity_threshold: 0.7

document:
  output_dir: "output"

agents:
  max_news_items: 20
  verification_depth: 3
