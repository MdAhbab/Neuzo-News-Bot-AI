# Neuzo Configuration File
# Note: For production, override these values via environment variables or a separate config

# Database Settings
database:
  host: "localhost"
  port: 3306
  database: "neuzo_db"
  user: "root"
  password: "root"  # Set your MySQL password here or via DATABASE_PASSWORD env var
  pool_size: 10
  pool_recycle: 3600

# News API Settings
# Get your API key from https://newsapi.org/
news_api:
  api_key: "3f15adc8f07344a8b09c3e6473694b24"  # Set your NewsAPI key here or via NEWSAPI_KEY env var
  
# Session Settings
session:
  expiry_hours: 24
  use_redis: false  # Set to true if REDIS_URL environment variable is set

# Time Settings
time_window_hours: 1  # Fetch news from the last N hours

# Categories (supported by most news APIs)
categories:
  - business
  - entertainment
  - general
  - health
  - science
  - sports
  - technology

# NLP Model Settings
nlp:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"  # Fast and efficient
  similarity_threshold: 0.7  # Threshold for news verification
  enable_caching: true  # Cache model in memory
  
# Document Generation Settings
document:
  output_dir: "output"
  template_title: "Neuzo News Report"
  include_timestamp: true
  
# Agent Settings
agents:
  max_news_items: 20  # Maximum news items to fetch
  verification_depth: 3  # Number of sources to cross-reference

# Security Settings
security:
  rate_limiting: true
  max_login_attempts: 10  # Per minute
  max_signup_attempts: 5  # Per minute
